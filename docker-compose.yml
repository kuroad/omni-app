version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: omni_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cynder
      POSTGRES_PASSWORD: cyber123
      POSTGRES_DB: omni_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: omni_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omni_api
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://cynder:cyber123@db:5432/omni_app
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app  # Hot reload support

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omni_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app  # Hot reload support
      - /app/node_modules  # Prevent local node_modules from overriding container's

volumes:
  postgres_data:
