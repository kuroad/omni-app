version: '3.8'

services:
  frontend:
    image: ghcr.io/kuroad/omni-app-frontend:latest
    container_name: hsr-frontend
    ports:
      - "14000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:3001
    volumes:
      - /DATA/AppData/omni-app/frontend:/app/logs
    networks:
      - hsr_network
    depends_on:
      - backend
    restart: always

  backend:
    image: ghcr.io/kuroad/omni-app-backend:latest
    container_name: hsr-backend
    ports:
      - "14001:3001"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://postgres:postgres@db:5432/hsr
    volumes:
      - /DATA/AppData/omni-app/backend:/app/logs
    networks:
      - hsr_network
    depends_on:
      - db
      - redis
    restart: always

  db:
    image: postgres:16-alpine
    container_name: hsr-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hsr
    volumes:
      - /DATA/AppData/omni-app/postgres:/var/lib/postgresql/data
    networks:
      - hsr_network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: hsr-redis
    ports:
      - "6379:6379"
    volumes:
      - /DATA/AppData/omni-app/redis:/data
    networks:
      - hsr_network
    restart: always

networks:
  hsr_network:


